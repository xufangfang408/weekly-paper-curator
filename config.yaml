researcher_profile: |
  Researcher: Fangfang Xu (Computational Biology & AI for Science).
  Long-term Research Vision (4 Core Pillars):
  1. [3D Multi-omics]: Reconstructing 3D whole-organ molecular atlases and continuous spatial multi-omics (transcriptomics, proteomics, metabolomics) from serial histology (H&E) and sparse spatial measurements.
  2. [Multi-omics Representation Learning]: Learning unified, transferable biological representations across partially paired or unpaired modalities (e.g., histology-anchored alignment, vision-omics foundation models, optimal transport, flow matching).
  3. [Virtual Cell & Virtual Organ]: Predictive modeling of cellular and tissue-level responses to genetic/chemical perturbations, scaling from single-cell virtual cells to spatially structured 3D virtual organs / digital twins.
  4. [Downstream Medical & Real-World Value]: Translating these computational models into tangible clinical and pharmaceutical impact—actionable target discovery, drug perturbation prioritization, patient stratification, and therapy design.
